<!DOCTYPE html>
<html lang="uz">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Menyu</title>
	<meta name="description" content="Restoran menyusi">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/theme-premium.css">
	<link rel="stylesheet" href="css/order.css">
	<!-- Xarita: Leaflet 1.9.4 (BSD-2) + OpenStreetMap plitkalari — API kalit talab qilmaydi -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<script>
		// Mavzu sahifa chizilishidan oldin qo'yiladi — "sakrash" bo'lmasligi uchun.
		// Standart — klassik (style.css). Premium faqat tanlansa yoqiladi.
		(function () {
			var p = new URLSearchParams(location.search).get('theme');
			var theme = p || localStorage.getItem('theme') || 'classic';
			if (p) localStorage.setItem('theme', p);
			if (theme === 'premium') document.documentElement.dataset.theme = 'premium';
		})();
	</script>
</head>
<body>
<header class="site-header">
	<div class="wrap header-inner">
		<a class="logo" href="./">Menyu</a>
		<nav class="langs" id="langs">
			<a href="?lang=uz" data-lang="uz">UZ</a>
			<a href="?lang=ru" data-lang="ru">RU</a>
			<a href="?lang=en" data-lang="en">EN</a>
			<button type="button" class="theme-toggle" id="theme-toggle" title="Dizaynni almashtirish">◑</button>
			<button type="button" class="cart-btn" id="cart-btn" title="Savatcha">
				🛒<span class="cart-count" id="cart-count" hidden>0</span>
			</button>
		</nav>
	</div>
</header>

<!-- Premium mavzu uchun: hero. Klassik mavzuda ko'rinmaydi. -->
<div class="premium-only hero-band">
	<div class="hero-glow"></div>
	<div class="wrap hero-inner">
		<div class="hero-eyebrow">
			<span class="hero-eyebrow-line"></span>
			<span class="hero-eyebrow-text" id="hero-eyebrow">Premium Taomshunoslik</span>
		</div>
		<h1 class="hero-title" id="hero-title">MENYU</h1>
		<p class="hero-subtitle" id="hero-subtitle">Lazzat dengizining sultoni</p>
		<div class="hero-stats" id="hero-stats"></div>
	</div>
</div>

<!-- Premium mavzu uchun: kontakt lentasi -->
<div class="premium-only contact-band">
	<a href="tel:+998912613000" class="contact-band-item">📞 (91) 261-30-00</a>
	<span class="contact-band-divider"></span>
	<span class="contact-band-item">🚚 Yetkazib berish — BEPUL</span>
	<span class="contact-band-divider"></span>
	<span class="contact-band-item">📍 Tuman markaziy shifoxonasi yonida</span>
</div>

<main class="wrap">
	<h1 class="page-title" id="page-title">Menyu</h1>

	<div class="toolbar">
		<input type="search" id="search" class="search" autocomplete="off" placeholder="Menyudan qidirish…">
	</div>

	<nav class="cat-nav" id="cat-nav"></nav>

	<div id="groups"></div>

	<p class="empty" id="no-result" hidden>Hech narsa topilmadi.</p>
	<p class="empty" id="loading">Yuklanmoqda…</p>
</main>

<footer class="site-footer">
	<div class="wrap">
		<span id="footer-text"></span>
	</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
	integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
	import { getCategories, getProducts, imageUrl } from './js/appwrite.js';
	import * as cart from './js/cart.js';
	import { initOrderUI } from './js/order-ui.js';

	const LANGS = ['uz', 'ru', 'en'];
	const params = new URLSearchParams(location.search);
	const lang = LANGS.includes(params.get('lang')) ? params.get('lang')
		: LANGS.includes(localStorage.getItem('lang')) ? localStorage.getItem('lang')
		: 'uz';
	localStorage.setItem('lang', lang);
	document.documentElement.lang = lang;

	const T = {
		uz: { menu: 'Menyu', search: 'Menyudan qidirish…', none: 'Hech narsa topilmadi.', other: 'Boshqa', empty: 'Menyu hozircha bo‘sh.', loading: 'Yuklanmoqda…', error: 'Menyuni yuklab bo‘lmadi. Sahifani yangilab ko‘ring.',
			eyebrow: 'Premium Taomshunoslik', subtitle: 'Lazzat dengizining sultoni',
			stats: [['12+', 'Kategoriya'], ['144', 'Taom'], ['0', 'Yetkazish narxi'], ['100%', 'Halol']] },
		ru: { menu: 'Меню', search: 'Поиск по меню…', none: 'Ничего не найдено.', other: 'Другое', empty: 'Меню пока пустое.', loading: 'Загрузка…', error: 'Не удалось загрузить меню. Обновите страницу.',
			eyebrow: 'Премиум кухня', subtitle: 'Султан моря вкуса',
			stats: [['12+', 'Категорий'], ['144', 'Блюда'], ['0', 'Цена доставки'], ['100%', 'Халяль']] },
		en: { menu: 'Menu', search: 'Search the menu…', none: 'Nothing found.', other: 'Other', empty: 'The menu is empty for now.', loading: 'Loading…', error: 'Could not load the menu. Please refresh.',
			eyebrow: 'Premium Cuisine', subtitle: 'The sultan of flavour',
			stats: [['12+', 'Categories'], ['144', 'Dishes'], ['0', 'Delivery fee'], ['100%', 'Halal']] },
	}[lang];

	// --- Mavzu almashtirish ---
	document.getElementById('theme-toggle').addEventListener('click', () => {
		const premium = document.documentElement.dataset.theme === 'premium';
		if (premium) {
			delete document.documentElement.dataset.theme;
			localStorage.setItem('theme', 'classic');
		} else {
			document.documentElement.dataset.theme = 'premium';
			localStorage.setItem('theme', 'premium');
		}
	});

	const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
		({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
	const t = (row, field) => row[`${field}_${lang}`] || row[`${field}_uz`] || '';
	const money = (n) => Number(n || 0).toLocaleString('ru-RU');

	document.getElementById('page-title').textContent = T.menu;
	document.getElementById('hero-title').textContent = T.menu.toUpperCase();
	document.getElementById('hero-eyebrow').textContent = T.eyebrow;
	document.getElementById('hero-subtitle').textContent = T.subtitle;
	document.getElementById('search').placeholder = T.search;
	document.getElementById('no-result').textContent = T.none;
	document.getElementById('loading').textContent = T.loading;
	document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} Menyu`;

	document.querySelectorAll('#langs a').forEach((a) => {
		if (a.dataset.lang === lang) a.classList.add('is-active');
	});

	const catNav = document.getElementById('cat-nav');
	const groupsEl = document.getElementById('groups');
	const loadingEl = document.getElementById('loading');

	const orderUI = initOrderUI(lang);
	document.getElementById('cart-btn').addEventListener('click', orderUI.openDrawer);

	try {
		const [categories, products] = await Promise.all([
			getCategories(),
			getProducts({ activeOnly: true }),
		]);
		loadingEl.hidden = true;

		// Hero statistikasi — haqiqiy raqamlar bazadan
		const stats = [...T.stats];
		stats[0] = [`${categories.length}`, T.stats[0][1]];
		stats[1] = [`${products.length}`, T.stats[1][1]];
		document.getElementById('hero-stats').innerHTML = stats.map(([n, l]) => `
			<div class="hero-stat">
				<span class="hero-stat-num">${esc(n)}</span>
				<span class="hero-stat-label">${esc(l)}</span>
			</div>`).join('');

		if (!products.length) {
			groupsEl.innerHTML = `<p class="empty">${esc(T.empty)}</p>`;
		} else {
			const used = categories.filter((c) => products.some((p) => p.category_id === c.$id));
			const uncategorized = products.filter((p) => !used.some((c) => c.$id === p.category_id));

			catNav.innerHTML = used.map((c) => `
				<a href="#cat-${c.$id}" class="${c.image ? 'has-img' : ''}">
					${c.image ? `<img src="${imageUrl(c.image)}" alt="" loading="lazy">` : ''}
					<span>${esc(t(c, 'name'))}</span>
				</a>`).join('');

			const groups = used.map((c) => ({
				id: c.$id,
				title: t(c, 'name'),
				items: products.filter((p) => p.category_id === c.$id),
			}));
			if (uncategorized.length) groups.push({ id: 'other', title: T.other, items: uncategorized });

			// O'lchamlar JSON matnda saqlanadi. Buzuq bo'lsa e'tiborsiz qoldiriladi —
			// mahsulot oddiy bitta narx bilan ko'rinaveradi.
			const parseSizes = (raw) => {
				if (!raw) return [];
				try {
					const list = JSON.parse(raw);
					return Array.isArray(list)
						? list.filter((s) => s && s.label && Number.isFinite(Number(s.price)))
						: [];
				} catch { return []; }
			};

			const card = (p) => {
				const sizes = parseSizes(p.sizes);
				const startPrice = sizes.length ? Number(sizes[0].price) : p.price;

				return `
				<article class="card" data-name="${esc((p.name_uz + ' ' + p.name_ru + ' ' + p.name_en).toLowerCase())}">
					<div class="card-img">
						${p.image
							? `<img src="${imageUrl(p.image)}" alt="${esc(t(p, 'name'))}" loading="lazy">`
							: '<span class="no-photo">🍔</span>'}
						${p.badge ? `<span class="card-badge">${esc(p.badge)}</span>` : ''}
					</div>
					<div class="card-body">
						<h3 class="card-name">${esc(t(p, 'name'))}</h3>
						${t(p, 'desc') ? `<p class="card-desc">${esc(t(p, 'desc'))}</p>` : ''}
						${sizes.length ? `
						<div class="size-row">
							${sizes.map((s, i) => `
								<button type="button" class="size-btn${i === 0 ? ' is-active' : ''}"
									data-price="${Number(s.price)}">${esc(s.label)}</button>`).join('')}
						</div>` : ''}
						<p class="card-price">${money(startPrice)} <span>so‘m</span></p>
						<button type="button" class="card-add"
							data-id="${esc(p.$id)}"
							data-name="${esc(t(p, 'name'))}"
							data-price="${Number(startPrice)}"
							data-image="${p.image ? esc(imageUrl(p.image)) : ''}"
							${sizes.length ? `data-size="${esc(sizes[0].label)}"` : ''}>${esc(orderUI.addLabel)}</button>
					</div>
				</article>`;
			};

			groupsEl.innerHTML = groups.map((g) => `
				<section class="cat-block" id="cat-${g.id}">
					<h2 class="cat-title">${esc(g.title)}</h2>
					<div class="grid">${g.items.map(card).join('')}</div>
				</section>`).join('');
		}
	} catch (err) {
		loadingEl.hidden = true;
		groupsEl.innerHTML = `<p class="empty">${esc(T.error)}</p>`;
		console.error(err);
	}

	// Savatchaga qo'shish
	groupsEl.addEventListener('click', (e) => {
		const add = e.target.closest('.card-add');
		if (!add) return;

		cart.addItem({
			id: add.dataset.id,
			name: add.dataset.name,
			price: Number(add.dataset.price),
			image: add.dataset.image || null,
			sizeLabel: add.dataset.size || null,
		});

		add.classList.add('is-added');
		add.textContent = orderUI.addedLabel;
		setTimeout(() => {
			add.classList.remove('is-added');
			add.textContent = orderUI.addLabel;
		}, 1200);
	});

	// O'lcham tugmasi bosilganda narx almashadi
	groupsEl.addEventListener('click', (e) => {
		const btn = e.target.closest('.size-btn');
		if (!btn) return;

		const row = btn.closest('.size-row');
		row.querySelectorAll('.size-btn').forEach((b) => b.classList.remove('is-active'));
		btn.classList.add('is-active');

		const price = btn.closest('.card').querySelector('.card-price');
		price.innerHTML = `${money(btn.dataset.price)} <span>so‘m</span>`;

		const add = btn.closest('.card').querySelector('.card-add');
		add.dataset.price = btn.dataset.price;
		add.dataset.size = btn.textContent;
	});

	// Qidiruv — sahifa yuklangandan keyin ishlaydi
	const input = document.getElementById('search');
	const nothing = document.getElementById('no-result');
	input.addEventListener('input', () => {
		const text = input.value.trim().toLowerCase();
		const cards = [...document.querySelectorAll('.card')];
		const blocks = [...document.querySelectorAll('.cat-block')];
		cards.forEach((c) => { c.hidden = text && !c.dataset.name.includes(text); });
		blocks.forEach((b) => { b.hidden = !b.querySelector('.card:not([hidden])'); });
		catNav.hidden = Boolean(text);
		nothing.hidden = !text || blocks.some((b) => !b.hidden);
	});
</script>
</body>
</html>
