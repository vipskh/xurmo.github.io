<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Telegram WebView o'z sarlavha panelini qo'yadi va klaviatura ochilganda
         oynani qisqartiradi. maximum-scale/user-scalable ilova ekranini telefon
         ilovasidek tutadi (brauzer sahifasidek emas); viewport-fit=cover esa
         pastki qismini to'liq egallaydi. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Xurmo</title>

    <!-- Telegram Mini App SDK — `window.Telegram.WebApp` ni yaratadi, uni
         lib/telegram.ts o'qiydi.
         Ilova bundle'i <body> oxirida `defer` bilan yuklanadi, ya'ni bu skript
         undan OLDIN ishga tushadi — lib/telegram.ts ilova ko'tarilishi bilanoq
         initData ni o'qiydi (avtomatik kirish uchun), shuning uchun WebApp
         obyekti o'shanda tayyor bo'lishi shart.
         Telegram bu faylni FAQAT o'z domenidan yuklashni talab qiladi — o'z
         serveringizga nusxalamang.
         Telegram tashqarisida (oddiy brauzer) skript yuklanadi-yu, initData
         bo'sh bo'ladi va lib/telegram.ts butunlay no-op bo'lib qoladi. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* KOMPYUTER ko'rinishi.
         Ilovaning har bir ekrani telefon kengligiga mo'ljallab
         chizilgan (dubizzle o'lchamlari bo'yicha). Keng monitorda uni
         butun ekranga cho'zish har bir ekranni qaytadan chizishni
         talab qilardi; buning o'rniga — Telegram Web va ko'p
         mobil-birinchi ilovalar qiladigan yo'l: ilova markazda,
         telefon kengligidagi ustunda turadi.

         900px — planshetning bo'yiga qo'yilgani hali telefon
         ko'rinishida qolsin degan chegara. */
      @media (min-width: 900px) {
        body {
          background: #ede9e4;
        }

        #root {
          width: 100%;
          max-width: 460px;
          margin: 0 auto;
          background: #fff;
          box-shadow: 0 0 44px rgba(20, 24, 40, 0.16);
        }
      }

      @media (min-width: 900px) and (prefers-color-scheme: dark) {
        body {
          background: #0d0f12;
        }
        #root {
          background: #11141b;
          box-shadow: 0 0 44px rgba(0, 0, 0, 0.5);
        }
      }
    </style>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

</body>
</html>
